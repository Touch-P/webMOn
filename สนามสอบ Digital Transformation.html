<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: OMR answer-sheet metaphor — question pane + bubble grid, sticky timer bar */
:root{
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#1B2230; --muted:#5B6475; --line:#D8DDE6;
  --accent:#C8324B; --accent-soft:#FBE8EB; --accent-ink:#FFFFFF;
  --good:#1F7A4D; --good-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FCE9E7; --flag:#B26A00; --flag-soft:#FFF2DB;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141A; --card:#191E26; --ink:#E8EBF1; --muted:#9BA4B4; --line:#2C3340;
  --accent:#F0718A; --accent-soft:#3A1D26; --accent-ink:#1A0A0F;
  --good:#5CC48C; --good-soft:#15301F; --bad:#F2918A; --bad-soft:#3A1A18; --flag:#F2B35A; --flag-soft:#33260F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141A; --card:#191E26; --ink:#E8EBF1; --muted:#9BA4B4; --line:#2C3340;
  --accent:#F0718A; --accent-soft:#3A1D26; --accent-ink:#1A0A0F;
  --good:#5CC48C; --good-soft:#15301F; --bad:#F2918A; --bad-soft:#3A1A18; --flag:#F2B35A; --flag-soft:#33260F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-family:var(--f-display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* start */
.start{display:grid;gap:24px;grid-template-columns:1.3fr 1fr;align-items:start;margin-top:12px}
.start .lead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.start h1{font-size:clamp(26px,4vw,36px);margin:6px 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.fact{border-top:2px solid var(--accent);padding-top:8px}
.fact b{display:block;font-family:var(--f-display);font-size:26px}
.fact span{font-size:13px;color:var(--muted)}
.rules{margin:0;padding-left:20px;color:var(--muted)}
.rules li{margin:4px 0}
.chaplist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.chaplist ol{margin:10px 0 0;padding-left:22px;font-size:14.5px}
.chaplist li{margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.resume{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14.5px}

/* exam bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.progress{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;margin-top:20px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--f-display);font-weight:700;font-size:20px}
.tag{font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.sc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.qtext{font-size:17px;margin:0 0 18px;max-width:68ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt .t{padding-top:2px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
.flagbtn.on{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}

/* answer sheet */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.sheet h3{font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:6px;font-size:11.5px;font-family:var(--f-mono);display:grid;place-items:center;background:var(--card);padding:0;color:var(--muted)}
.cell.done{background:var(--ink);border-color:var(--ink);color:var(--card)}
.cell.flag{box-shadow:inset 0 -3px 0 var(--flag)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.sheet .btn{width:100%;margin-top:12px}
.confirm{margin-top:12px;padding:12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.confirm .row{margin-top:8px}

/* results */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;margin-top:12px}
.score{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1}
.score small{font-size:24px;color:var(--muted);font-weight:500}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.split div{border-left:3px solid var(--line);padding-left:10px}
.split b{font-family:var(--f-display);font-size:22px;display:block}
.split span{font-size:13px;color:var(--muted)}
.chaps{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
.chaps h2,.review h2{font-size:20px;margin-bottom:12px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.crow:last-child{border-bottom:0}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%}
.crow .pct{text-align:right;font-family:var(--f-mono);font-size:13.5px}
.weak{color:var(--bad);font-weight:600}
.review{margin-top:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters .btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ritem{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.ritem.wrong{border-left-color:var(--bad)}
.ritem.blank{border-left-color:var(--muted)}
.ritem .qtext{font-size:15.5px;margin-bottom:10px}
.ropt{font-size:14.5px;padding:4px 10px;border-radius:6px;margin:3px 0}
.ropt.ok{background:var(--good-soft);color:var(--good);font-weight:600}
.ropt.no{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.expl{margin-top:10px;font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.expl b{color:var(--ink)}

@media (max-width:860px){
  .start{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .sheet{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
  .res-top{grid-template-columns:1fr}
}
@media (max-width:480px){
  .facts{grid-template-columns:repeat(3,1fr)}
  .fact b{font-size:21px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .crow{grid-template-columns:minmax(0,1fr) 70px 48px}
  .qcard{padding:18px}
}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .3s}}
</style>

<script>
const CH=["ความรู้เบื้องต้น Digital Transformation","อิทธิพลของเทคโนโลยีดิจิทัล","การปรับกลยุทธ์ด้วยดิจิทัล","ความเชี่ยวชาญดิจิทัล (Digital Mastery)","ประสบการณ์ลูกค้า + Burberry","กระบวนการภายใน + Codelco / Air France","ธุรกิจรูปแบบใหม่ + Volvo / Hailo","วิสัยทัศน์ดิจิทัล + Pages Jaunes / Starbucks","การสร้างการมีส่วนร่วม + Pernod Ricard","การกำกับดูแลดิจิทัล + P&G","ความสามารถผู้นำเทคโนโลยี + LBG","การกำหนดกลยุทธ์ 3 แผน","การขับเคลื่อนการเปลี่ยนแปลง","ความยั่งยืนในการใช้ดิจิทัล","Business Transformation Outsourcing"];
// [chapter, scenario?, question, [correct, wrong, wrong, wrong], explanation]
const Q=[
[0,0,"ข้อใดอธิบายความแตกต่างระหว่างข้อมูลดิจิทัลกับอนาลอกได้ถูกต้อง",["ดิจิทัลเป็นข้อมูลแบบไม่ต่อเนื่อง ส่วนอนาลอกเป็นข้อมูลแบบต่อเนื่อง","ดิจิทัลเป็นข้อมูลแบบต่อเนื่อง ส่วนอนาลอกเป็นข้อมูลแบบไม่ต่อเนื่อง","ทั้งสองแบบเป็นข้อมูลแบบต่อเนื่อง ต่างกันแค่ความเร็ว","ดิจิทัลใช้ได้เฉพาะข้อความ ส่วนอนาลอกใช้กับภาพและเสียง"],"ดิจิทัลแทนข้อมูลด้วยค่าไม่ต่อเนื่อง (0/1) ส่วนอนาลอกเป็นสัญญาณต่อเนื่อง"],
[0,0,"ข้อใดไม่ใช่ปัจจัยผลักดันการเปลี่ยนแปลงสู่ดิจิทัลตามสภาเศรษฐกิจโลก",["การลดลงของจำนวนประชากรโลก","Internet of Things","การทำงานร่วมกันระหว่างมนุษย์กับเครื่องจักร","การขยายตัวของความเป็นเมือง (Urbanization)"],"6 ปัจจัยคือ Mobile/Internet, IoT, Data Analytics + Cloud, Human-Machine Collaboration, Global Connectivity และ Urbanization"],
[0,0,"ความท้าทายที่ธุรกิจต้องเผชิญจากผู้บริโภคยุคดิจิทัลตามบทเรียนคือข้อใด",["ผู้บริโภคให้ความสำคัญกับความเป็นส่วนตัวและความโปร่งใส","ผู้บริโภคเชื่อโฆษณาโดยตรงมากกว่าการบอกต่อ","ผู้บริโภคไม่ต้องการประสบการณ์ ต้องการแค่สินค้าราคาถูก","ผู้บริโภคใช้ช่องทางออฟไลน์มากขึ้น"],"ข้อมูลผู้บริโภคเป็นโอกาส แต่ผู้บริโภคก็ให้ความสำคัญกับความเป็นส่วนตัวและความโปร่งใส และเชื่อการบอกต่อมากกว่าโฆษณา"],
[0,0,"ข้อใดเป็นลักษณะของ Business Change (ไม่ใช่ Business Transformation)",["เริ่มจากบุคลากรในแต่ละหน่วยงาน และส่งผลเฉพาะหน่วยงาน","เริ่มจากผู้บริหารระดับบนสู่ทุกหน่วยงาน","เกิดจากการเปลี่ยนความเชื่อและวัฒนธรรมองค์กร","ส่งผลต่อทั้งองค์กรและการปฏิสัมพันธ์กับภายนอก"],"Change = ปรับปรุงสิ่งเดิม เกิดจากปัจจัยภายนอก เริ่มจากคนในหน่วยงาน ผลกระทบเฉพาะหน่วย · ข้ออื่นเป็นลักษณะของ Transformation"],
[0,0,"GULF เข้าซื้อ INTUCH เป็นตัวอย่างของวิธีเปลี่ยนสู่รูปแบบใหม่แบบใด",["Acquisition","Merger","Business Process Outsourcing","Internal Restructuring"],"Acquisition = ซื้อกิจการ · Merger คือ TOT + CAT → NT · Outsourcing คือกสิกรไทย + IBM · Internal Restructuring คือ SCB"],
[0,1,"บริษัทผลิตเครื่องดื่มแห่งหนึ่งเจอภาวะเศรษฐกิจชะลอตัว ฝ่ายบัญชีจึงนำซอฟต์แวร์ใหม่มาลดเวลาปิดงบจาก 10 วันเหลือ 3 วัน โดยฝ่ายอื่นทำงานเหมือนเดิม กรณีนี้จัดเป็นแบบใด",["Business Change เพราะปรับปรุงสิ่งเดิม เกิดจากปัจจัยภายนอก และกระทบเฉพาะหน่วยงาน","Business Transformation เพราะใช้เทคโนโลยีใหม่","Business Transformation เพราะลดเวลาได้มาก","Merger เพราะรวมระบบบัญชีเข้าด้วยกัน"],"ตัวชี้คือ ‘ปัจจัยภายนอก (เศรษฐกิจ) + เฉพาะหน่วยงาน + ปรับปรุงงานเดิม’ = Change ไม่ใช่ Transformation แม้จะใช้เทคใหม่"],
[0,1,"ธนาคารแห่งหนึ่งต้องการเปลี่ยนสู่ดิจิทัล โดย CEO ประกาศปรับโครงสร้างหน่วยงานภายในใหม่ทั้งหมด ไม่ควบรวมกับใครและไม่จ้างภายนอก แนวทางนี้ตรงกับวิธีใด",["Internal Restructuring","Acquisition","Merger","Business Process Outsourcing"],"ปรับโครงสร้างจากภายในเอง = Internal Restructuring (ตัวอย่างในสไลด์คือ SCB)"],
[0,1,"ร้านหนังสือแห่งหนึ่งพัฒนาจากการขายหนังสือ มาเป็นบริการสมาชิกยืมหนังสือ และล่าสุดเปิดคลับอ่านหนังสือที่มีกิจกรรมพบนักเขียนผ่านแอป ตอนนี้ร้านอยู่ในขั้นใดของการเปลี่ยนแปลงธุรกิจ",["สร้างประสบการณ์","ขายสินค้า","ให้บริการ","ลดต้นทุน"],"ลำดับการเปลี่ยนคือ ขายสินค้า → ให้บริการ → สร้างประสบการณ์ · คลับและกิจกรรมพบนักเขียนคือการขายประสบการณ์"],

const KEY="dt-mock-exam-v1";

function clear(){try{localStorage.removeItem(KEY)}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function remaining(){return DURATION-(Date.now()-S.startedAt)/1000}

function newExam(randomOrder){
  const idx=Q.map((_,i)=>i);

}

    <div class="row" style="margin-top:20px">
      <button class="btn primary" id="go">เริ่มทำข้อสอบ</button>
      <label class="check"><input type="checkbox" id="rnd" checked> สุ่มลำดับข้อ</label>
    </div>
    ${prev&&!prev.done?`<div class="resume">มีชุดที่ทำค้างไว้ (ตอบแล้ว ${prev.ans.filter(a=>a!==null).length} ข้อ) <div class="row" style="margin-top:8px"><button class="btn" id="resume">ทำต่อ</button></div></div>`:""}
    ${prev&&prev.done?`<div class="resume">ส่งคำตอบชุดล่าสุดแล้ว <div class="row" style="margin-top:8px"><button class="btn" id="seeres">ดูผลชุดล่าสุด</button></div></div>`:""}
  </section>
  <aside class="chaplist"><h3>หัวข้อที่ออกสอบ</h3><ol>${CH.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></aside>
  </div></div>`;
  document.getElementById("go").onclick=()=>newExam(document.getElementById("rnd").checked);
  const r=document.getElementById("resume"); if(r) r.onclick=()=>{S=prev;if(remaining()<=0){finish()}else renderExam()};
  const s2=document.getElementById("seeres"); if(s2) s2.onclick=()=>{S=prev;renderResults()};
}

function renderExam(){
  confirmOpen=false;
  app.innerHTML=`<div class="bar"><div class="in">
    <span class="timer num" id="timer">${fmt(remaining())}</span>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
    <span class="muted num" id="cnt"></span>
  </div></div>
  <div class="wrap"><div class="exam">
    <section class="qcard" id="qcard"></section>
    <aside class="sheet">
      <h3>กระดาษคำตอบ</h3>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i style="background:var(--ink);border-color:var(--ink)"></i>ตอบแล้ว</span><span><i style="box-shadow:inset 0 -3px 0 var(--flag)"></i>ปักธง</span><span><i></i>ยังไม่ตอบ</span></div>
      <button class="btn primary" id="submit">ส่งคำตอบ</button>
      <div id="confirm"></div>
    </aside>
  </div></div>`;
  document.getElementById("submit").onclick=()=>{confirmOpen=!confirmOpen;drawConfirm()};
  drawQ();drawGrid();drawBar();
  clearInterval(tick);
  tick=setInterval(()=>{const r=remaining();const t=document.getElementById("timer");if(!t)return;t.textContent=fmt(r);t.classList.toggle("low",r<900);if(r<=0)finish()},1000);
}

function drawConfirm(){
  const el=document.getElementById("confirm");
  if(!confirmOpen){el.innerHTML="";return}
  const blank=S.ans.filter(a=>a===null).length, fl=S.flag.filter(Boolean).length;
  el.innerHTML=`<div class="confirm">${blank?`ยังไม่ได้ตอบ <b class="num">${blank}</b> ข้อ`:"ตอบครบทุกข้อแล้ว"}${fl?` · ปักธงไว้ <b class="num">${fl}</b> ข้อ`:""}<br>ส่งแล้วจะแก้คำตอบไม่ได้<div class="row"><button class="btn primary" id="yes">ยืนยันส่ง</button><button class="btn ghost" id="no">กลับไปทำต่อ</button></div></div>`;
  document.getElementById("yes").onclick=finish;
  document.getElementById("no").onclick=()=>{confirmOpen=false;drawConfirm()};
}

function drawQ(){
  const i=S.cur, q=Q[S.order[i]], perm=S.opt[i];
  const el=document.getElementById("qcard");
  el.innerHTML=`<div class="qhead"><span class="qno num">ข้อ ${i+1}</span>
    <span class="tag ${q[1]?"sc":""}">${q[1]?"โจทย์สถานการณ์":"ความรู้"}</span>
    <span class="tag">${esc(CH[q[0]])}</span></div>
    <p class="qtext">${esc(q[2])}</p>
    <div class="opts" role="radiogroup" aria-label="ตัวเลือกข้อ ${i+1}">
    ${perm.map((o,k)=>`<label class="opt ${S.ans[i]===o?"sel":""}" data-o="${o}"><input type="radio" name="q" id="q${i}o${k}" ${S.ans[i]===o?"checked":""}><span class="bub">${LETTERS[k]}</span><span class="t">${esc(q[3][o])}</span></label>`).join("")}
    </div>
    <div class="nav">
      <button class="btn" id="prev" ${i===0?"disabled":""}>← ข้อก่อนหน้า</button>
      <button class="btn flagbtn ${S.flag[i]?"on":""}" id="flag">${S.flag[i]?"ปักธงแล้ว":"ปักธงข้อนี้"}</button>
      <button class="btn ${i===Q.length-1?"":"primary"}" id="next" ${i===Q.length-1?"disabled":""}>ข้อถัดไป →</button>
    </div>`;
  el.querySelectorAll(".opt").forEach(l=>l.addEventListener("click",e=>{e.preventDefault();const o=+l.dataset.o;S.ans[i]=S.ans[i]===o?null:o;save();drawQ();drawGrid();drawBar();if(confirmOpen)drawConfirm()}));
  document.getElementById("prev").onclick=()=>go(i-1);
  document.getElementById("next").onclick=()=>go(i+1);
  document.getElementById("flag").onclick=()=>{S.flag[i]=!S.flag[i];save();drawQ();drawGrid();if(confirmOpen)drawConfirm()};
}
function go(n){if(n<0||n>=Q.length)return;S.cur=n;save();drawQ();drawGrid();document.getElementById("qcard").scrollIntoView({block:"nearest"})}
function drawGrid(){
  const g=document.getElementById("grid");
  g.innerHTML=S.order.map((_,i)=>`<button class="cell num ${S.ans[i]!==null?"done":""} ${S.flag[i]?"flag":""} ${i===S.cur?"cur":""}" data-i="${i}" aria-label="ไปข้อ ${i+1}">${i+1}</button>`).join("");
  g.querySelectorAll(".cell").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function drawBar(){
  const n=S.ans.filter(a=>a!==null).length;
  document.getElementById("prog").style.width=(n/Q.length*100)+"%";
  document.getElementById("cnt").textContent=`ตอบแล้ว ${n}/${Q.length}`;
}

function finish(){
  clearInterval(tick);
  S.done=true;S.finishedAt=Math.min(Date.now(),S.startedAt+DURATION*1000);save();renderResults();window.scrollTo(0,0);
}

function renderResults(){
  clearInterval(tick);
  const rows=S.order.map((qi,i)=>({i,q:Q[qi],a:S.ans[i]}));
  const right=rows.filter(r=>r.a===0).length;
  const sc=rows.filter(r=>r.q[1]), kn=rows.filter(r=>!r.q[1]);
  const scR=sc.filter(r=>r.a===0).length, knR=kn.filter(r=>r.a===0).length;
  const blank=rows.filter(r=>r.a===null).length;
  const used=Math.round(((S.finishedAt||Date.now())-S.startedAt)/1000);
  const chapStats=CH.map((c,ci)=>{const rs=rows.filter(r=>r.q[0]===ci);const ok=rs.filter(r=>r.a===0).length;return{c,ok,n:rs.length,p:rs.length?ok/rs.length:0}});
  const pct=Math.round(right/Q.length*100);
  app.innerHTML=`<div class="wrap">
    <section class="res-top">
      <div><div class="eyebrow">คะแนนรวม</div><div class="score num">${right}<small>/${Q.length}</small></div><div class="muted num" style="margin-top:6px">${pct}% · ใช้เวลา ${fmt(used)}</div></div>
      <div>
        <h2 style="font-size:20px">${pct>=80?"พร้อมสอบแล้ว ทบทวนเฉพาะบทที่ยังพลาด":pct>=60?"ใกล้แล้ว เน้นบทที่คะแนนต่ำกว่า 60%":"ควรทบทวนอีกรอบ โดยเริ่มจากบทที่คะแนนต่ำสุด"}</h2>
        <div class="split">
          <div><b class="num">${scR}/${sc.length}</b><span>โจทย์สถานการณ์</span></div>
          <div><b class="num">${knR}/${kn.length}</b><span>โจทย์ความรู้</span></div>
          <div><b class="num">${blank}</b><span>ข้อที่ไม่ได้ตอบ</span></div>
        </div>
        <div class="row" style="margin-top:16px"><button class="btn primary" id="again">ทำชุดใหม่ (สุ่มใหม่)</button><button class="btn" id="home">กลับหน้าแรก</button></div>
      </div>
    </section>
    <section class="chaps"><h2>คะแนนแยกตามบท</h2>
      ${chapStats.map(s=>`<div class="crow"><span class="${s.p<0.6?"weak":""}">${esc(s.c)}</span><div class="meter"><i style="width:${s.p*100}%;background:${s.p>=0.8?"var(--good)":s.p>=0.6?"var(--flag)":"var(--bad)"}"></i></div><span class="pct num">${s.ok}/${s.n}</span></div>`).join("")}
    </section>
    <section class="review"><h2>เฉลยและคำอธิบาย</h2>
      <div class="filters">
        <button class="btn ${filter==="wrong"?"on":""}" data-f="wrong">ข้อที่ผิดหรือไม่ได้ตอบ (${Q.length-right})</button>
        <button class="btn ${filter==="sc"?"on":""}" data-f="sc">โจทย์สถานการณ์</button>
        <button class="btn ${filter==="all"?"on":""}" data-f="all">ทั้งหมด</button>
      </div>
      <div id="rlist"></div>
    </section>
  </div>`;
  document.getElementById("again").onclick=()=>{clear();newExam(true);window.scrollTo(0,0)};
  document.getElementById("home").onclick=renderStart;
  app.querySelectorAll(".filters .btn").forEach(b=>b.onclick=()=>{filter=b.dataset.f;app.querySelectorAll(".filters .btn").forEach(x=>x.classList.toggle("on",x===b));drawReview(rows)});
  drawReview(rows);
}
function drawReview(rows){
  const list=rows.filter(r=>filter==="all"?true:filter==="sc"?r.q[1]:r.a!==0);
  const el=document.getElementById("rlist");
  if(!list.length){el.innerHTML=`<p class="muted">ไม่มีข้อในหมวดนี้ ตอบถูกหมดแล้ว</p>`;return}
  el.innerHTML=list.map(r=>{const perm=S.opt[r.i];const st=r.a===0?"":r.a===null?"blank":"wrong";
    return `<article class="ritem ${st}"><div class="qhead"><span class="qno num" style="font-size:16px">ข้อ ${r.i+1}</span><span class="tag ${r.q[1]?"sc":""}">${r.q[1]?"สถานการณ์":"ความรู้"}</span><span class="tag">${esc(CH[r.q[0]])}</span>${r.a===null?`<span class="tag">ไม่ได้ตอบ</span>`:""}</div>
    <p class="qtext">${esc(r.q[2])}</p>
    ${perm.map((o,k)=>{const cls=o===0?"ok":(o===r.a?"no":"");return cls?`<div class="ropt ${cls}">${LETTERS[k]}. ${esc(r.q[3][o])}${o===0?" ✓":""}</div>`:""}).join("")}
    <div class="expl"><b>เหตุผล:</b> ${esc(r.q[4])}</div></article>`}).join("");
}

(function init(){
  const prev=load();
  if(prev&&!prev.done&&Array.isArray(prev.order)&&prev.order.length===Q.length){S=prev;if(remaining()<=0)finish();else renderExam()}
  else renderStart();
})();
</script>

</body></html>
